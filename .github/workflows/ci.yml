name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --config tauri.ci.conf.json
            rust-targets: aarch64-apple-darwin
          - os: windows-latest
            args: --config tauri.ci.conf.json
            rust-targets: ""
          - os: ubuntu-24.04
            args: --config tauri.ci.conf.json
            rust-targets: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      # Xcode 26 places libclang_rt.osx.a in a clang version dir that rustc's
      # `-lclang_rt.osx` link arg doesn't resolve on its own, so add its real
      # location to the linker search path explicitly.
      - name: Add clang runtime to linker search path
        if: runner.os == 'macOS'
        run: |
          runtime_lib="$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" -name 'libclang_rt.osx.a' 2>/dev/null | head -n1)"
          if [ -z "$runtime_lib" ]; then
            echo "libclang_rt.osx.a not found in the active Xcode toolchain" >&2
            exit 1
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-L $(dirname "$runtime_lib")" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev \
            libvulkan-dev \
            glslc

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download Visual C++ Redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile src-tauri/resources/vc_redist.x64.exe

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm vitest run

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # Retry to ride out transient 403s from the pyke CDN that ort-sys pulls
      # prebuilt ONNX Runtime binaries from.
      - name: Test Rust
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3; do
            cargo test && exit 0
            echo "cargo test failed (attempt $attempt/3); retrying in 20s" >&2
            sleep 20
          done
          exit 1

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          args: ${{ matrix.args }}
