[package]
name = "whispr"
version = "1.3.0"
description = "Push-to-talk dictation app for macOS, powered by Deepgram"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whispr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.10"
url = "2"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "macros"] }
# Two FLAC crates because each is single-direction: flacenc encodes,
# claxon decodes. flacenc's default features pull crossbeam/serde/log,
# which we don't need.
claxon = "0.4"
flacenc = { version = "0.5", default-features = false }
# cpal is cross-platform (CoreAudio/WASAPI/ALSA) — used by recorder on all targets.
cpal = "0.15"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext",
    "NSImage", "NSImageRep", "NSWorkspace",
] }
whisper-rs = { version = "0.13", features = ["metal"] }

